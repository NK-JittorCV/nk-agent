[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoagent-jittor"
version = "0.1.0"
description = "Pure-Jittor inference for ghost233lism/GeoAgent (Qwen2.5-VL-7B)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "jittor==1.3.11.0",
  "numpy>=1.26,<2",
  "pillow>=11,<13",
  "tokenizers>=0.21,<0.22",
]

[project.optional-dependencies]
convert = [
  "huggingface-hub>=0.34,<1",
  "safetensors>=0.5,<0.7",
  "torch==2.6.0",
]
reference = [
  "accelerate>=1.10,<2",
  "qwen-vl-utils==0.0.10",
  "torch==2.6.0",
  "transformers==4.55.4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
geoagent-jittor = "geoagent_jittor.cli:main"
geoagent-jittor-convert = "geoagent_jittor.convert:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoagent_jittor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv]
cache-dir = ".uv-cache"
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
